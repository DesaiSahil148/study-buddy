<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Study Buddy</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- ==================== BACKGROUND ==================== -->
    <div class="background-overlay"></div>
    <div class="particles"></div>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar relative z-50">
        <div class="container flex justify-between items-center h-full">
            <div class="logo flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="logo-icon text-2xl animate-float">🤖</div>
                <span class="font-heading font-bold text-xl tracking-tight">Study Buddy</span>
            </div>
            <a href="index.html" class="text-sm text-muted hover:text-white transition-colors">← Back to Home</a>
        </div>
    </nav>

    <!-- ==================== LOGIN FORM ==================== -->
    <main class="container relative z-10 min-h-[calc(100vh-80px)] flex flex-col justify-center items-center">

        <div
            class="glass-card w-full max-w-md p-8 border-purple-500/30 shadow-[0_0_50px_rgba(168,85,247,0.15)] fade-in">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold font-heading text-white mb-2">Welcome Back</h2>
                <p class="text-muted text-sm">Sign in to access your study materials</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs uppercase text-muted font-bold tracking-wider mb-2">Email
                        Address</label>
                    <input type="email" id="email"
                        class="glass-input w-full bg-black/20 border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500/50 transition-all outline-none"
                        placeholder="sahil@example.com" required>
                </div>

                <div>
                    <label class="block text-xs uppercase text-muted font-bold tracking-wider mb-2">Password</label>
                    <input type="password" id="password"
                        class="glass-input w-full bg-black/20 border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500/50 transition-all outline-none"
                        placeholder="••••••••" required>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox"
                            class="rounded border-white/20 bg-black/40 text-purple-500 focus:ring-purple-500/50">
                        <span class="text-muted group-hover:text-white transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors">Forgot password?</a>
                </div>

                <button type="submit"
                    class="btn w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 border border-white/10 shadow-lg shadow-purple-900/50 font-medium text-white transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center text-sm">
                <p class="text-muted">Don't have an account? <a href="#"
                        class="text-white hover:underline decoration-purple-500 underline-offset-4">Sign up</a></p>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="js/login.js" type="module"></script>
</body>

</html>
